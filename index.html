<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body
    style="background-image: url(media/Henna.jpeg)"
    class="flex justify-center h-screen items-center bg-cover bg-center bg-no-repeat"
  >
    <div
      class="bg-white border px-10 py-8 border-4 border-gray-300 shadow-lg shadow-amber-300 rounded-xl text-center animate__animated animate__backInDown m-8 w-80"
      id="kartu"
    >
      <h1 class="text-3xl">Happy Birthday</h1>
      <h1
        class="text-4xl text-amber-400 font-bold animate__animated animate__pulse animate__infinite"
      >
        Shahana Qabila
      </h1>
      <button
        class="p-2 bg-amber-400 text-white rounded mt-5 hover:bg-amber-300 transition ease-in w-full animate__animated animate__delay-1s animate__tada"
        onclick="ubahKartu()"
      >
        Klik Disini!
      </button>
    </div>

    <audio id="lagu" src="/lagu/ultah.mp3" autoplay loop></audio>
    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
    <script>
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
      });
      let kartu = document.getElementById("kartu");
      function ubahKartu() {
        document.getElementById("lagu").play();
        kartu.innerHTML = `    <h1 class="font-semibold text-wrap animate__animated animate__zoomIn">
       Met Ultah, Sashaa yang ke 19 yak? Semoga sehat selalu, 
       rezeki lancar, dan usaha atau kerja keras lu terbayar dengan hasil terbaik,
       termasuk diterima di kampus yang terbaik buat lu. Semoga kita bisa panjang umur 
       dan masih bisa bertemu serta saling dukung! 🎉🎂
    </h1>
    <h2 class="mt-3 animate__animated animate__fadeIn">
      - Dari : Faza -
    </h2>
    <button
      class="p-2 bg-amber-600 text-white rounded mt-5 hover:bg-amber-400 transition ease-in w-full animate__animated animate__delay-1s animate__tada"
      onclick="goToCake()"
    >
      Klik lagi!
    </button>
    `;
      }
      function goToCake() {
        window.location.href = "birthday-cake.html";
      }
    </script>
  </body>
</html>
